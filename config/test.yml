# Smallest run that still exercises the real code path.
#
# Not a unit test: it runs the actual sceptre calls on the real object, just few enough of them to
# finish in minutes. Same shape as workflow/slurm_executor/03_smoke_simulation.sbatch, which is what
# it is calibrated against.
#
#   PARAMS_FILE=config/test.yml sbatch workflow/nextflow/run.sbatch
#
# This is a params file rather than a `-profile test`, deliberately. Nextflow gives -params-file
# precedence over profile params, and the driver always passes one -- so test settings expressed as
# a profile were silently overridden by config/config.yml, and a "test" run quietly used production
# values. Profiles select where a run executes; params files select what it runs.

# The SYNTHETIC object from src/make_test_data.R, not a lab dataset. The default samplesheet
# pointed at results/day0_grna20_no_shuffle/sceptre_object.rds -- a path that only ever existed on
# one machine, and which broke the moment those results were moved off it. A test configuration
# should not depend on anyone's disk.
#
# Generate it first, which takes ~45 s and needs no lab data:
#   sbatch workflow/slurm_executor/13_make_test_data.sbatch
#
# tests/data/ is gitignored -- the object is 648 KB against the pre-commit hook's 512 KB ceiling,
# and regenerating it is the point of having a generator.
samplesheet: assets/samplesheet_synthetic.csv
outdir: results/nextflow_test

effect_sizes:
  - 0.15

num_replicates: 2
guide_sd: 0.13
seed: 20250812

# Split as production does, then simulate only the first few, so the split geometry is identical to
# a real run rather than a special case.
# Must not exceed the object's target count: whole targets stay together, so split_pairs.R cannot
# write more splits than there are targets, and SPLIT_PAIRS asserts it wrote exactly n_splits. The
# synthetic object has 12 targets, so 1000 here failed that assertion -- it only ever worked
# because this profile used to point at a 3,026-target lab object. 4 matches what
# 13_make_test_data.sbatch computes for the same object.
#
# Note test_max_splits below does NOT help: it trims the channel AFTER splitting, so all n_splits
# files are still written.
n_splits: 4
test_max_splits: 3

reps_per_chunk: 2
reps_per_null_chunk: 2
test_max_null_reps: 2

power_threshold: 0.8
conf_level: 0.95
