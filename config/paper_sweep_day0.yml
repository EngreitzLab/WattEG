# Full six-point sweep on day0, for the paper.
#
# One params file per dataset, and one Nextflow run per dataset, deliberately: the three runs are
# independent failure domains. `errorStrategy = finish` stops a run from submitting new tasks once
# a task fails unrecoverably, so a single run covering all three datasets would let one bad object
# take the other two down with it overnight.
#
# Everything except `samplesheet` and `outdir` is identical across the three files. Keep it that
# way -- the whole point of three datasets is that the only thing differing is the data.

samplesheet: assets/samplesheet_paper_day0.csv
outdir: /home/users/emattei/oak/projects/element-gene-power-analysis/power_sweep/day0

# The six-point grid, matching the one dc_tap_paper_wtc11_no_shuf already carries. Matching it is
# the point: the reduced-design study (paper/experiments.md steps 2-3) compares three points
# against six on the same data, and a cross-dataset comparison needs the same grid on both sides.
#
# ~634 CPU-hours per effect size on a day0-shaped dataset, so ~3,800 CPU-hours for this file.
effect_sizes:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.5

num_replicates: 100
guide_sd: 0.13

# Parallelisation only; results are invariant to it. 1,000 keeps a task at ~36 minutes, which
# matters on `owners`: a preempted task loses its own work and nothing else.
n_splits: 1000
reps_per_null_chunk: 1
reps_per_chunk: 100

seed: 20250812

power_threshold: 0.8
conf_level: 0.95
