[workspace]
name = "watteg"
description = "Power analysis for element-gene pairs in single-cell CRISPR screens"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

# No R. The pipeline was an R/sceptre pipeline until the Python port; every step now runs on
# pysceptre, so this environment is one Python package plus a workflow runner. What that removes is
# not just r-base: it is the pinned sceptre commit, the local patch applied to it, the pinned ondisc
# commit, the `setup` task that installed both from source, the `check-api` task that verified the
# pin against the unexported S4 slots the pipeline read, and the HDF5/curl/openssl link-line
# dependencies ondisc's static build needed. See docs/pysceptre-backend.md.
#
# The R implementation has not been deleted -- it is the reference the Python path was validated
# against and what the paper describes -- but it is no longer what this environment provides. To run
# it, use the environment recorded in the `legacy` branch's pixi.toml.

[dependencies]
python = "3.12.*"
numpy = ">=1.24"
scipy = ">=1.10"
pandas = ">=2.0"
h5py = ">=3.8"          # the sim_input container
pyarrow = ">=14"        # the consolidated per-replicate Parquet
numba = "*"             # JIT for pysceptre's CRT sampler; it falls back without it, more slowly
anndata = "*"           # reading the .h5mu pysceptre's export writes
mudata = "*"
nextflow = "*"          # the pipeline runner (the only package from bioconda)

[pypi-dependencies]
# pysceptre is not on conda-forge, bioconda or PyPI, so it enters as a git dependency pinned by
# commit. That is the same shape as the old SCEPTRE_SHA pin, minus the patch and the API check: the
# pipeline calls pysceptre's documented entry points rather than reaching into its internals, so a
# version bump is caught by this repository's own tests rather than by a bespoke checker.
# Pinned to a commit, not the branch: a branch moves, and a sweep has to be re-runnable
# against the engine it was produced with.
pysceptre = { git = "https://github.com/broadinstitute/pysceptre.git", rev = "594d5ff" }
watteg = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=7"
ruff = ">=0.5"

[environments]
dev = ["dev"]

[tasks]
# The fixture is generated, not committed: it is ~1 MB of synthetic counts that any checkout can
# rebuild in a second, and a binary blob in git is a blob in every clone forever.
test-data = { cmd = "watteg-make-test-data --out tests/data/synthetic.h5mu", description = "Generate the synthetic dataset the stub run and smoke test use" }
pipeline-test = { cmd = "nextflow run . -profile stub -params-file config/test.yml -stub-run", depends-on = ["test-data"], description = "Check the Nextflow DAG wiring without running anything" }
install-hooks = { cmd = "./.githooks/install.sh", description = "Enable the repository pre-commit hook" }
lint = { cmd = "./.githooks/pre-commit --all", description = "Run the pre-commit checks across every tracked file" }

[feature.dev.tasks]
test = { cmd = "pytest", description = "Run the unit tests" }
format = { cmd = "ruff format src tests workflow && ruff check --fix src tests workflow", description = "Format and lint" }
