[workspace]
name = "element-gene-power-analysis"
description = "SCEPTRE-based power analysis for element-gene pairs in single-cell CRISPR screens"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

# sceptre is installed from a pinned GitHub commit by `pixi run setup`, not from a conda
# channel: it is not published on conda-forge or bioconda. The pipeline reads several
# *unexported* S4 slots of `sceptre_object`, so the version must be pinned exactly and
# verified by `pixi run check-api`. See docs/development.md.
[activation.env]
R_LIBS_USER = "$PIXI_PROJECT_ROOT/.pixi/rlibs"
# SCEPTRE_REF is the DESCRIPTION version at the pinned commit, not a git tag: 0.99.0 is the
# in-development Bioconductor-prep version on `main` and is untagged (v0.10.3 is still the newest
# tag). check_sceptre_api.R compares it against packageVersion("sceptre").
SCEPTRE_REF = "v0.99.0"
SCEPTRE_SHA = "3ba046b86f33e99dee633fbb8704ee8defdb442d"
# ondisc, for odm-backed (out-of-core) response matrices. Same story as sceptre: not on
# conda-forge or bioconda, so it is installed from a pinned commit by `pixi run setup`. ONDISC_REF
# is the DESCRIPTION version at the pinned commit; ondisc is untagged, so like SCEPTRE_REF it names
# a version rather than a tag.
ONDISC_REF = "v1.3.5"
ONDISC_SHA = "589803edea2a66ad15e7f07186bee16c7739ab8c"

# Runtime dependencies. Kept deliberately small: our own scripts use base R for all file
# I/O and data manipulation (read.delim/write.table/merge/aggregate) rather than pulling in
# the tidyverse. Every entry below is either called by our code or reached by the sceptre
# code path this pipeline uses -- each one verified by grepping sceptre's sources, not by
# copying its DESCRIPTION.
[dependencies]
r-base = "4.4.*"
r-optparse = "*"      # CLI parsing for every src/ script
nextflow = "*"        # pipeline runner (the only package from bioconda)

# --- reached by the sceptre functions we call (run_discovery_analysis, get_result,
#     import_data, set_analysis_parameters, assign_grnas, run_qc) --------------------
r-matrix = "*"        # sceptre NAMESPACE import; also used directly by our scripts
r-rcpp = ">=1.0.9"    # sceptre NAMESPACE import
r-dplyr = "*"         # s4_analysis_functs_*, pairwise_qc_functs, import_functs, assign_grna_functions
# quoted: an unquoted r-data.table would parse as the dotted TOML key r-data.table
"r-data.table" = "*"  # medium_level_functs_v2, pairwise_qc_functs, aux_functions
r-purrr = "*"         # purrr::flatten() in medium_level_functs_v2.R:123,205 (precomputation path)
r-crayon = "*"        # console messages in check_functions, import_functs, s4_helpers
# Added by sceptre 0.99.0. Both are in its DESCRIPTION Imports, which R CMD INSTALL enforces, and
# both are reached at runtime rather than only at build time: parallelly::availableCores() replaced
# parallel::detectCores() for core detection (aux_functions.R), and withr::with_seed/with_options
# are used throughout. The lower bound is not the DESCRIPTION's >=1.23.0 but the >=1.47.0 that
# aux_functions.R's own comment calls for; conda-forge resolves to 1.48.0, which satisfies both.
r-parallelly = ">=1.47.0"
r-withr = "*"

# --- reached by ondisc, for odm-backed (out-of-core) response matrices ------------------
#
# ondisc itself is installed from a pinned commit by `pixi run setup` (see ONDISC_SHA above), not
# listed here -- it is not on conda-forge or bioconda. Its DESCRIPTION Imports are, and R CMD
# INSTALL enforces all of them, so they have to be present before that install can run.
#
# Already covered above: Matrix, Rcpp, dplyr, data.table, crayon. New here:
"bioconductor-rhdf5lib" = "*"  # ondisc NAMESPACE `import(Rhdf5lib)` -- loaded on every library(ondisc),
                               # not build-only, so this is a RUNTIME dependency. Also its LinkingTo.
r-readr = "*"                  # ondisc DESCRIPTION Imports; 2 readr:: references in its sources

# Rhdf5lib ships HDF5 as static archives (libhdf5.a, libhdf5_cpp.a) and ondisc links them into
# ondisc.so, but static HDF5 still needs its own dependencies resolved -- ondisc's link line ends
# `-lcrypto -lcurl -lsz -laec -lz -ldl -lm`. Without them the build dies at the very last step with
# `ld: cannot find -lz`, after every object file has already compiled, which reads like a broken
# toolchain rather than a missing package.
#
# These are runtime dependencies, not build-only: only HDF5 itself is static, so ondisc.so carries
# DT_NEEDED entries for these and needs them present whenever it loads. They sit here rather than
# in [feature.build.dependencies] for that reason -- the build environment inherits [dependencies]
# anyway, so one entry covers both.
zlib = "*"                     # -lz
libcurl = "*"                  # -lcurl
openssl = "*"                  # -lcrypto
libaec = "*"                   # -lsz and -laec (szip)

# One Bioconductor package is required, and only one: bioconductor-rhdf5lib, above, which arrives
# with ondisc and nothing else. The rest of this note stands, and is the reason that is worth
# stating rather than assuming.
#
# The old pipeline used SingleCellExperiment purely
# as a container -- a per-gene table, a per-cell table, two sparse perturbation matrices,
# and row/column subsetting. Nothing on the live code path touched rowRanges or any genomic
# range (the only GRanges use was in filt_max_dist_pert(), part of the dead code removed in
# Step 1), so lib/sim_input.R replaces it with a plain list plus subset helpers. That
# drops SingleCellExperiment, SummarizedExperiment, S4Vectors, GenomicRanges, IRanges,
# GenomeInfoDb, GenomeInfoDbData, DelayedArray, MatrixGenerics, Biobase, BiocGenerics,
# XVector, S4Arrays, SparseArray, abind and zlibbioc.
#
# It also sidesteps a real setup failure: bioconductor-genomeinfodbdata installs its data
# through a conda post-link script, which pixi skips by default, so GenomeInfoDb -- and
# therefore SingleCellExperiment -- could not be loaded at all without every user first
# running `pixi config set --local run-post-link-scripts insecure`.
#
# Deliberately NOT included, unlike the old envs/power_analysis.yml:
#   bioconductor-deseq2      only reachable via fit_negbinom_deseq2(), which nothing calls;
#                            poscounts size factors are computed directly in
#                            prepare_sim_input.R
#   bioconductor-rtracklayer referenced nowhere in the codebase
#   r-devtools               was only there to install_github(sceptre) at runtime, which
#                            raced across parallel tasks and wrote into the shared env
#   r-tidyverse/r-tibble     replaced by base R in our scripts
#
# r-readr was in that list until ondisc arrived: our own scripts still use base R for all file
# I/O, but ondisc's DESCRIPTION Imports it and R CMD INSTALL enforces that field. It is here for
# ondisc's benefit, not ours -- the same reason most of the runtime list exists for sceptre's.

# Building sceptre from source needs a compiler toolchain, remotes, and -- as verified by
# a failed install -- every package in sceptre's DESCRIPTION Imports, because R CMD INSTALL
# enforces that field even for packages absent from NAMESPACE. ggplot2, cowplot and scales
# are needed *only* for that check: at runtime they are confined to plotting_functions.R,
# qq_plot_helpers.R and write_outputs_to_directory(), none of which this pipeline calls. So
# they stay out of the runtime environment that every Nextflow task activates.
[feature.build.dependencies]
r-remotes = "*"
c-compiler = "*"
cxx-compiler = "*"
# Header-only Boost. sceptre declares `LinkingTo: Rcpp, BH`, so BH is used to *compile* the C++ and
# is never loaded at runtime -- confirmed by src/audit_dependencies.R, which finds it the only
# declared dependency with no reference anywhere in the package's code. It sat in the runtime
# environment until 2026-08-14 under a comment calling it a "NAMESPACE import", which it is not:
# sceptre's NAMESPACE imports only Matrix and Rcpp.
r-bh = "*"
r-ggplot2 = "*"
r-cowplot = "*"
r-scales = "*"

[feature.dev.dependencies]
r-testthat = "*"

[environments]
build = ["build"]
dev = ["dev"]

[tasks]
check-api = { cmd = "Rscript src/check_sceptre_api.R", description = "Verify the pinned sceptre exposes every internal slot the pipeline depends on" }
pipeline-test = { cmd = "nextflow run . -profile stub -params-file config/test.yml -stub-run", description = "Check the Nextflow DAG wiring without running anything" }
install-hooks = { cmd = "git config core.hooksPath .githooks && echo 'core.hooksPath -> .githooks'", description = "Enable the repository pre-commit hook" }
lint = { cmd = "./.githooks/pre-commit --all", description = "Run the pre-commit checks across every tracked file" }

# Scoped to the environments that carry the extra dependencies, so `pixi run setup`
# resolves to the build environment without the caller having to name it.
[feature.build.tasks]
setup = { cmd = "Rscript src/install_sceptre.R && Rscript src/install_ondisc.R", description = "Install sceptre (patched) and ondisc from their pinned commits into .pixi/rlibs" }

[feature.dev.tasks]
test = { cmd = "Rscript -e 'testthat::test_dir(\"tests/testthat\")'", description = "Run unit tests" }
