[project]
name = "watteg"
version = "0.1.0.dev0"
description = "Power analysis for element-gene pairs in single-cell CRISPR screens"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "h5py>=3.8",
    "pyarrow>=14",
    "pysceptre",
]

[project.scripts]
watteg-prepare-sim-input = "watteg.cli.prepare_sim_input:main"
watteg-run-power-simulation = "watteg.cli.run_power_simulation:main"
watteg-split-pairs = "watteg.cli.split_pairs:main"
watteg-consolidate-replicates = "watteg.cli.consolidate_replicates:main"
watteg-compute-power = "watteg.cli.compute_power:main"
watteg-summarize-power = "watteg.cli.summarize_power:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watteg"]

